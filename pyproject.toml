[project]
name = "openam-config-auditor"
version = "0.0.0"
description = "Specification-stage project for deterministic OpenAM configuration auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
